<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ♡ luvselris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: rgba(255, 255, 255, 0.95);
      --pastel-pink: #ffb3c6;
      --deep-pink: #fb6f92;
      --soft-pink: #ffe5ec;
      --border-pink: #ffc2d1;
      --text-main: #4a3b3e;
      --text-muted: #9c8287;
      --glow-shadow: 0 10px 30px rgba(251, 111, 146, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #ffe5ec 0%, #fff0f3 55%, #ffe8ed 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;
    }

    /* LOGIN VIEW */
    #loginView {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 38px 24px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-pink);
      text-align: center;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--deep-pink);
      margin-bottom: 22px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
      font-weight: 600;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-pink);
      border-radius: 18px;
      font-size: 14px;
      background: #fff;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--deep-pink);
      box-shadow: 0 0 0 3px rgba(251, 111, 146, 0.25);
    }

    .btn-pink {
      width: 100%;
      background: linear-gradient(135deg, #ffc2d1, var(--deep-pink));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(251, 111, 146, 0.35);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .error-text {
      color: #ff4d6d;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* DASHBOARD */
    #dashboardView {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 4px 6px;
    }

    .welcome-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--deep-pink);
    }

    .logout-btn {
      background: #fff;
      color: var(--deep-pink);
      border: 1.5px solid var(--border-pink);
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-pink);
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--deep-pink);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upload-box {
      border: 1.5px dashed var(--border-pink);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      background: #fff9fb;
      margin-bottom: 14px;
    }

    .preview-banner {
      width: 100%;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 10px;
      display: none;
      border: 2px solid #fff;
    }

    .preview-profile {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: none;
      border: 3px solid var(--border-pink);
    }

    .file-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ffc2d1, var(--deep-pink));
      color: #fff;
      padding: 7px 18px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(251, 111, 146, 0.3);
    }

    /* Highlight Card Admin */
    .hl-admin-card {
      background: #ffffff;
      border: 1.5px solid var(--border-pink);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .hl-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .hl-cover-preview {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-pink);
      background: #fff5f7;
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .story-slot {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px dashed var(--border-pink);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fffafa;
    }

    .story-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-slot .del-story-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(255, 77, 109, 0.85);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reviews-admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .review-item {
      background: #fff;
      border: 1px solid var(--border-pink);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-delete {
      background: #fff0f3;
      border: 1px solid var(--border-pink);
      color: var(--deep-pink);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- LOGIN SCREEN -->
    <div id="loginView">
      <div class="login-card">
        <h1 class="login-title">Admin Login ♡</h1>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>email</label>
            <input type="email" id="emailInput" class="input-field" placeholder="srezinalm@gmail.com" required>
          </div>

          <div class="form-group">
            <label>password</label>
            <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-pink">เข้าสู่ระบบ ✨</button>
          <p id="loginError" class="error-text">อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardView">
      
      <div class="top-bar">
        <div class="welcome-text">welcome admin ♡</div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>

      <!-- 1. ข้อมูลร้าน -->
      <div class="panel-card">
        <div class="panel-title">🎀 ข้อมูลร้านและรูปภาพ</div>

        <div class="form-group">
          <label>รูปแบนเนอร์ (เลือกจากเครื่อง)</label>
          <div class="upload-box">
            <img id="bannerPreview" class="preview-banner" alt="Banner Preview">
            <label class="file-btn">
              เลือกรูปแบนเนอร์
              <input type="file" accept="image/*" style="display: none;" onchange="handleImageFile(this, 'bannerPreview', 'banner')">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>รูปโปรไฟล์ (เลือกจากเครื่อง)</label>
          <div class="upload-box">
            <img id="profilePreview" class="preview-profile" alt="Profile Preview">
            <label class="file-btn">
              เลือกรูปโปรไฟล์
              <input type="file" accept="image/*" style="display: none;" onchange="handleImageFile(this, 'profilePreview', 'profile')">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>ชื่อร้าน</label>
          <input type="text" id="storeNameInput" class="input-field" placeholder="luvselris ♡">
        </div>

        <div class="form-group">
          <label>คำอธิบายร้าน</label>
          <textarea id="storeBioInput" class="textarea-field" rows="3" placeholder="ข้อความแนะนำร้าน..."></textarea>
        </div>
      </div>

      <!-- 2. ไฮไลท์ 3 อัน -->
      <div class="panel-card">
        <div class="panel-title">✨ จัดการไฮไลท์ 3 รายการ</div>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
          สามารถตั้งชื่อ เปลี่ยนรูปปก และกดเพิ่มรูปสตอรี่ได้สูงสุด 10 รูป (ยังไม่ครบ 10 รูปก็ใส่เท่าที่มีก่อนได้เลยค่ะ)
        </p>

        <div id="highlightsAdminBox"></div>
      </div>

      <!-- 3. ลิงก์เพลงพื้นหลัง (Auto-play) -->
      <div class="panel-card">
        <div class="panel-title">🎵 ลิงก์เพลงพื้นหลัง (Auto-play)</div>
        <div class="form-group">
          <label>ใส่ลิงก์ไฟล์เสียง (.mp3)</label>
          <input type="url" id="musicUrlInput" class="input-field" placeholder="https://files.catbox.moe/zy1wnq.mp3">
        </div>
      </div>

      <!-- ปุ่มบันทึกขึ้นระบบ -->
      <button type="button" class="btn-pink" id="saveAllBtn" style="font-size: 16px; padding: 15px; margin-bottom: 20px;" onclick="saveAllToCloud()">
        ☁️ บันทึกขึ้นระบบ (หน้าเว็บเปลี่ยนทันที) ♡
      </button>

      <!-- 4. ลบรีวิว -->
      <div class="panel-card">
        <div class="panel-title">🗑️ รีวิวจากลูกค้า (กดลบได้)</div>
        <div class="reviews-admin-list" id="reviewsAdminContainer">
          <p style="text-align: center; color: var(--text-muted); font-size: 13px;">กำลังโหลดรีวิว...</p>
        </div>
      </div>

    </div>

  </div>

  <script>
    const AUTH_EMAIL = "srezinalm@gmail.com";
    const AUTH_PASS = "@Natthanan2911";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let siteData = {
      banner: "https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif",
      profile: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg",
      storeName: "luvselris ♡",
      storeBio: "ยินดีต้อนรับเข้าสู่ร้าน luvselris ♡\nสามารถกดดูไฮไลท์ที่เราลงไว้เพื่อดูตัวอย่างได้เลย ขอบคุณที่กดเข้ามานะคะ",
      musicUrl: "https://files.catbox.moe/zy1wnq.mp3",
      highlights: [
        { title: "Review 1", cover: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", stories: [] },
        { title: "Review 2", cover: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", stories: [] },
        { title: "Review 3", cover: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", stories: [] }
      ]
    };

    window.onload = function() {
      if (sessionStorage.getItem('luvselris_admin_gh_auth') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const err = document.getElementById('loginError');

      if (email === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('luvselris_admin_gh_auth', 'true');
        err.style.display = 'none';
        showDashboard();
      } else {
        err.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('luvselris_admin_gh_auth');
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'flex';
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection("luvselris_site").doc("highlight_content").get();
        if (doc.exists) {
          siteData = { ...siteData, ...doc.data() };
        }
      } catch (err) {
        console.error(err);
      }

      renderAdminPanels();
      listenReviewsAdmin();
    }

    function renderAdminPanels() {
      if (siteData.banner) {
        const b = document.getElementById('bannerPreview');
        b.src = siteData.banner;
        b.style.display = 'block';
      }
      if (siteData.profile) {
        const p = document.getElementById('profilePreview');
        p.src = siteData.profile;
        p.style.display = 'block';
      }
      document.getElementById('storeNameInput').value = siteData.storeName || '';
      document.getElementById('storeBioInput').value = siteData.storeBio || '';
      document.getElementById('musicUrlInput').value = siteData.musicUrl || '';

      // เรนเดอร์ 3 ไฮไลท์
      const hlBox = document.getElementById('highlightsAdminBox');
      hlBox.innerHTML = '';

      siteData.highlights.forEach((hl, hIdx) => {
        const card = document.createElement('div');
        card.className = 'hl-admin-card';

        let storiesHTML = '';
        const currentCount = hl.stories ? hl.stories.length : 0;

        if (hl.stories) {
          hl.stories.forEach((stImg, sIdx) => {
            storiesHTML += `
              <div class="story-slot">
                <img src="${stImg}">
                <button class="del-story-btn" onclick="removeStoryImage(${hIdx}, ${sIdx})">✕</button>
              </div>
            `;
          });
        }

        let addBtnHTML = '';
        if (currentCount < 10) {
          addBtnHTML = `
            <div class="story-slot" style="cursor: pointer;">
              <label style="cursor: pointer; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--deep-pink);">
                +
                <input type="file" accept="image/*" style="display: none;" onchange="addStoryImage(this, ${hIdx})">
              </label>
            </div>
          `;
        }

        card.innerHTML = `
          <div style="font-weight: 700; color: var(--deep-pink); margin-bottom: 8px;">ไฮไลท์ที่ ${hIdx + 1}</div>
          <div class="hl-header-row">
            <img src="${hl.cover || 'https://i.ibb.co/gZg1bdv9/IMG-3203.jpg'}" class="hl-cover-preview" id="hlCoverPreview_${hIdx}">
            <div style="flex: 1;">
              <input type="text" id="hlTitle_${hIdx}" class="input-field" value="${hl.title || ''}" placeholder="ชื่อไฮไลท์" style="margin-bottom: 6px;">
              <label class="file-btn" style="font-size: 11px; padding: 4px 12px;">
                เปลี่ยนรูปปก
                <input type="file" accept="image/*" style="display: none;" onchange="changeHlCover(this, ${hIdx})">
              </label>
            </div>
          </div>

          <div style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 10px;">
            รูปในสตอรี่ (${currentCount}/10 รูป):
          </div>
          <div class="stories-grid">
            ${storiesHTML}
            ${addBtnHTML}
          </div>
        `;
        hlBox.appendChild(card);
      });
    }

    function compressImage(file, maxWidth, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleImageFile(input, previewId, key) {
      if (input.files && input.files[0]) {
        compressImage(input.files[0], 600, function(base64) {
          siteData[key] = base64;
          const imgElem = document.getElementById(previewId);
          imgElem.src = base64;
          imgElem.style.display = 'block';
        });
      }
    }

    function changeHlCover(input, hlIdx) {
      if (input.files && input.files[0]) {
        compressImage(input.files[0], 400, function(base64) {
          siteData.highlights[hlIdx].cover = base64;
          document.getElementById(`hlCoverPreview_${hlIdx}`).src = base64;
        });
      }
    }

    function addStoryImage(input, hlIdx) {
      if (input.files && input.files[0]) {
        if (!siteData.highlights[hlIdx].stories) siteData.highlights[hlIdx].stories = [];
        if (siteData.highlights[hlIdx].stories.length >= 10) {
          alert('ใส่รูปในสตอรี่นี้ครบ 10 รูปแล้วค่ะ');
          return;
        }

        compressImage(input.files[0], 700, function(base64) {
          siteData.highlights[hlIdx].stories.push(base64);
          renderAdminPanels();
        });
      }
    }

    function removeStoryImage(hlIdx, storyIdx) {
      siteData.highlights[hlIdx].stories.splice(storyIdx, 1);
      renderAdminPanels();
    }

    async function saveAllToCloud() {
      const btn = document.getElementById('saveAllBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล... ⏳';

      siteData.storeName = document.getElementById('storeNameInput').value;
      siteData.storeBio = document.getElementById('storeBioInput').value;
      siteData.musicUrl = document.getElementById('musicUrlInput').value.trim();

      for (let i = 0; i < 3; i++) {
        const titleVal = document.getElementById(`hlTitle_${i}`).value.trim();
        siteData.highlights[i].title = titleVal || `Highlight ${i + 1}`;
      }

      try {
        await db.collection("luvselris_site").doc("highlight_content").set(siteData);
        alert('✨ บันทึกข้อมูลและไฮไลท์ทั้งหมดเรียบร้อยแล้วค่ะ! หน้าเว็บหลักจะเปลี่ยนทันที ♡');
      } catch (err) {
        console.error(err);
        alert('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้งนะคะ');
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️ บันทึกขึ้นระบบ (หน้าเว็บเปลี่ยนทันที) ♡';
      }
    }

    function listenReviewsAdmin() {
      db.collection("luvselris_reviews")
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          const container = document.getElementById('reviewsAdminContainer');
          if (snapshot.empty) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px;">ไม่มีรีวิวในระบบ</p>';
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const r = doc.data();
            html += `
              <div class="review-item">
                <div style="flex: 1; padding-right: 8px;">
                  <div style="font-weight: 700; font-size: 13.5px;">${r.name}</div>
                  <div style="font-size: 12px; margin: 2px 0;">${'⭐️'.repeat(r.stars || 5)}</div>
                  <div style="font-size: 12.5px; color: #635355;">${r.feedback}</div>
                </div>
                <button class="btn-delete" onclick="deleteReview('${doc.id}')">ลบ 🗑️</button>
              </div>
            `;
          });
          container.innerHTML = html;
        });
    }

    async function deleteReview(docId) {
      if (confirm('ต้องการลบรีวิวนี้ใช่หรือไม่คะ? 🗑️')) {
        try {
          await db.collection("luvselris_reviews").doc(docId).delete();
        } catch (e) {
          console.error(e);
        }
      }
    }
